name: sqbcp_gpu
channels:
  - pytorch
  - nvidia       # <-- PŘIDÁNO: nutné pro stažení libcublas a dalších CUDA knihoven
  - pyg
  - conda-forge
  - defaults
  - bioconda      # <-- PŘIDÁNO: pro biopython, pokud není dostupný v conda-forge

dependencies:
  - python=3.10
  # Core scientific
  - numpy
  - scipy
  - scikit-learn

  # PyTorch
  - pytorch            # <-- PŘIDÁNO: samotný framework je stále nutný
  - pytorch-cuda=12.1  # <-- PONECHÁNO: specifikace verze CUDA
  - torchvision
  - torchaudio            

  # PyTorch Geometric
  - pyg::pyg

  # Bioinformatics
  - conda-forge::biopython

  - bioconda::mmseqs2
  - mmseqs2

  # pip-only packages
  - pip
  - pip:
      - transformers      # HuggingFace (ESM-2 model)
      - sentencepiece     # tokenizer backend pro transformers